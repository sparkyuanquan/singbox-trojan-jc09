name: Build singbox trojan for JC09

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入要编译的 sing-box 版本 (例如: v1.9.3)'
        required: true
        default: 'v1.9.3'

# 赋予 Actions 创建 Release 的写入权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x' # 🔒 锁定 Go 1.23 版本，完美解决 1.26 的编译报错

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build sing-box
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          # 仅保留 utls，极限精简
          go build -v -tags "with_utls" -trimpath -ldflags "-s -w -buildid=" -o sing-box ./cmd/sing-box
          
      - name: Compress with UPX
        run: |
          upx --best --lzma sing-box

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}-jc09
          name: Sing-box Trojan for JC09 (${{ github.event.inputs.version }})
          body: |
            🚀 **专为 JC09 随身 WiFi 打造的极限精简版 Sing-box**
            - **架构**: ARM64 (aarch64)
            - **包含特性**: Trojan 协议支持, uTLS 伪装
            - **优化**: 已去除调试信息并使用 UPX 极限压缩，专为小内存/小存储设备优化。
          files: sing-box
